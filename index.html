<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shred Coach</title>
<meta name="description" content="Offline hypertrophy logbook with live set targets.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shred Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1412" media="(prefers-color-scheme: dark)">
<style>
/* Layout: one-column phone logbook; sticky top bar, bottom tab bar, cards per exercise with set rows */
:root{
  --bg:#ECEFEA; --surface:#FFFFFF; --surface-2:#F5F7F3; --ink:#131A16; --muted:#5B655F; --line:#D7DCD5;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#E3EAFD;
  --good:#1E7A46; --good-bg:#DCF1E3; --warn:#8F5600; --warn-bg:#FBEBCB; --bad:#B42318; --bad-bg:#FADFDB;
  --next:#FFF1C2; --next-line:#E8C860;
  --f-display:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1210; --surface:#171C19; --surface-2:#1D2420; --ink:#E8EDE9; --muted:#9AA49E; --line:#2A332E;
  --accent:#86A8FF; --accent-ink:#0A1024; --accent-soft:#1B2645;
  --good:#5ED291; --good-bg:#14301F; --warn:#F1B755; --warn-bg:#33270E; --bad:#FF8B7B; --bad-bg:#3A1A16;
  --next:#33300F; --next-line:#7A6A1E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1210; --surface:#171C19; --surface-2:#1D2420; --ink:#E8EDE9; --muted:#9AA49E; --line:#2A332E;
  --accent:#86A8FF; --accent-ink:#0A1024; --accent-soft:#1B2645;
  --good:#5ED291; --good-bg:#14301F; --warn:#F1B755; --warn-bg:#33270E; --bad:#FF8B7B; --bad-bg:#3A1A16;
  --next:#33300F; --next-line:#7A6A1E; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 140px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
.top .sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.top .grow{flex:1;min-width:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted)}
.notice{font-size:13px;border-radius:10px;padding:8px 12px;background:var(--warn-bg);color:var(--warn)}
/* NEXT banner */
.next{background:var(--next);border:1px solid var(--next-line);border-radius:var(--r);padding:14px;display:grid;gap:6px}
.next .what{font-weight:700;font-size:15px}
.next .tgt{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.next .why{font-size:13px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
/* Home */
.daylist{display:grid;gap:8px}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.day .dn{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.day .dn small{display:block;font-size:12px;font-family:var(--f-body);color:var(--muted);font-weight:600;letter-spacing:.06em}
.day .t{font-weight:700}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.hero{display:grid;gap:10px}
.hero h2{font-family:var(--f-display);font-size:34px;line-height:1;margin:0}
/* Exercise cards */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex-h{padding:12px 14px 8px;display:grid;gap:4px}
.ex-h .nm{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ss{font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--ink);color:var(--bg);border-radius:6px;padding:0 6px}
.ex-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sets{display:grid}
.set{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%}
.set .sn{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted);text-align:center}
.set .tg{display:block;font-family:var(--f-display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.set .why{display:block;font-size:12px;color:var(--muted);margin-top:2px}
[hidden]{display:none!important}
.set .last{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.set.done .tg{color:var(--good)}
.set.isnext{background:var(--next)}
.set.isnext .sn{color:var(--ink)}
.why.good{color:var(--good)} .why.bad{color:var(--bad)}
.logger{padding:12px 14px 14px;border-top:1px solid var(--line);background:var(--next);display:grid;gap:10px}
.logger.edit{background:var(--surface-2)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--surface-2);font-size:20px;font-weight:700}
.stepper input{border:0;text-align:center;font-family:var(--f-display);font-size:26px;font-weight:700;width:100%;min-width:0;background:transparent;padding:6px 0;font-variant-numeric:tabular-nums}
.hist{padding:8px 14px 12px;border-top:1px solid var(--line);overflow-x:auto}
.hist table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;width:100%}
.hist th,.hist td{padding:4px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.meta{font-size:12.5px;color:var(--muted);line-height:1.4}.meta .bad{color:var(--bad)}
.pair{font-size:12.5px;color:var(--muted);margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card.scard h3{margin:0 0 4px}.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.setrow.col{display:block}.setrow b{display:block;font-size:15px}.setrow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--good)}.switch:checked::after{transform:translateX(20px)}
.warm{font-size:12.5px;color:var(--muted);padding:8px 14px 0}
.top .iconbtn{color:var(--ink)}
.ptabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 12px}
.ptabs button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;padding:8px 4px;border-radius:9px}
.ptabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
form.inline{display:flex;gap:8px}form.inline input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:18px;background:var(--surface);color:var(--ink)}
.chart{width:100%;height:auto;margin-top:10px;display:block}.chart .grid{stroke:var(--line);stroke-width:1}.chart .tgt{stroke:var(--good);stroke-width:1.5;stroke-dasharray:4 4}.chart .ax{fill:var(--muted);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}.legend i{display:inline-block;vertical-align:middle;margin-right:5px}.legend .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}.legend .ln{width:14px;height:3px;border-radius:2px;background:var(--accent)}
.streak{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0 4px;border-top:1px solid var(--line);font-size:14px}
.streak .dots{display:flex;gap:5px}.streak .dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.streak .dots i.p{background:var(--warn-bg);outline:1px solid var(--warn)}.streak .dots i.g{background:var(--good)}
.review{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:14px;line-height:1.45}
.meter{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:10px}.meter i{display:block;height:100%;background:var(--accent)}
.pslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pslot{position:relative;aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;overflow:hidden;cursor:pointer;background:var(--surface-2);font-weight:700;color:var(--muted)}
.pslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.pslot em{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:11px;padding:4px;background:rgba(0,0,0,.55);color:#fff;text-align:center}
.cmp{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#000}.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp img.after{clip-path:inset(0 0 0 var(--p))}.cmp .bar{position:absolute;top:0;bottom:0;left:var(--p);width:2px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.6)}
.cmp .tagl,.cmp .tagr{position:absolute;top:8px;font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff}.cmp .tagl{left:8px}.cmp .tagr{right:8px}
.form select{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink);width:100%}
.prow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.prow>span{width:56px;flex:none}.prow>div{display:flex;gap:6px;flex-wrap:wrap}
.pthumb{position:relative;width:64px;height:84px;border-radius:8px;overflow:hidden;display:inline-block}.pthumb img{width:100%;height:100%;object-fit:cover}
.pthumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.srow b{display:block;font-size:14px}.srow .small{display:block}
.srow .up{color:var(--good);font-weight:700}.srow .down{color:var(--bad);font-weight:700}
.prline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.focusline{display:block;padding:10px 14px}.focusline .label{margin-right:4px}
.btn.endbtn{background:var(--bad);color:#fff}.btn.wide{width:100%}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fadein .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.2);animation:slideup .2s ease-out}
.sheet h2{font-family:var(--f-display);font-size:26px;margin:4px 0 4px}.sheet .row-actions{margin-top:14px}.sheet .row-actions .btn{flex:1}
@keyframes slideup{from{transform:translateY(30px);opacity:.4}}@keyframes fadein{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg{animation:none}}
body.noscroll{overflow:hidden}
details.hist>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}details.hist>summary::-webkit-details-marker{display:none}
details.hist summary b{display:block}details.hist summary .small{display:block}details.hist .hs{text-align:right;flex:none;max-width:45%}
details.hist[open]>summary{margin-bottom:6px}
.hrow{padding:8px 0;border-top:1px solid var(--line)}.hrow b{display:block;font-size:14px;margin-bottom:3px}.hrow span{display:flex;flex-wrap:wrap;gap:6px}
.hrow i{font-style:normal;font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px 7px;font-variant-numeric:tabular-nums}.hrow i.pr{background:var(--good-bg);border-color:transparent;color:var(--good);font-weight:700}
.linkbtn.plain{color:inherit;font:inherit;text-decoration:underline dotted;text-underline-offset:2px}
.ex-h .nm .grow{flex:1;min-width:0}
.set .tg.dim{color:var(--muted);font-size:17px;font-weight:500}
.notice.good{background:var(--good-bg);color:var(--good)}
details.fold>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.fold>summary::after{content:"▾";color:var(--muted)}details.fold[open]>summary{margin-bottom:10px}details.fold[open]>summary::after{content:"▴"}
details.fold>summary::-webkit-details-marker{display:none}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:0}
/* forms + tables */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:600}
.form input{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);width:100%;min-width:0}
.form .hint{font-weight:400;color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi.key{background:var(--accent-soft);border-color:transparent}
.kpi.key b{color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl td.wrap{white-space:normal;min-width:200px}
.status{font-weight:600;border-radius:8px;padding:2px 8px;display:inline-block}
.status.good{background:var(--good-bg);color:var(--good)}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.status.bad{background:var(--bad-bg);color:var(--bad)}
.prose h3{font-family:var(--f-display);font-size:22px;margin:4px 0 6px}
.prose dl{display:grid;gap:10px;margin:0}
.prose dt{font-weight:700}
.prose dd{margin:2px 0 0;color:var(--ink)}
.prose dd .src{display:block;font-size:12px;color:var(--muted)}
.prose ul{padding-left:18px;margin:6px 0}
.prose a{color:var(--accent)}
/* rest timer + tabs */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.rest{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg)}
.rest .clock{font-family:var(--f-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.rest .info{flex:1;min-width:0;font-size:13px;line-height:1.3}
.rest .info b{display:block}
.rest.over{animation:restflash .5s ease-in-out 4 alternate}
@keyframes restflash{to{background:var(--accent,#3B82F6)}}
@media (prefers-reduced-motion:reduce){.rest.over{animation:none;outline:3px solid var(--accent,#3B82F6)}}
.rest button{background:transparent;color:var(--bg);border:1px solid currentColor;border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;margin:0 auto;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabs a{display:grid;place-items:center;gap:2px;padding:8px 0 10px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em}
.tabs a svg{width:22px;height:22px}
.tabs a.on{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.next,.logger{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div class="wrap" id="app"><div class="top"><div class="grow"><div class="sub">Shred Coach</div><h1>Loading your log…</h1></div></div></div>
<div class="dock" id="dock">
  <div class="rest" id="rest" hidden></div>
  <nav class="tabs" id="tabs">
    <a href="#train" data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Train</a>
    <a href="#checkin" data-tab="checkin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>Progress</a>
    <a href="#nutrition" data-tab="nutrition"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l5 3"/></svg>Nutrition</a>
    <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4h9l3 3v13H6z M9 10h6M9 14h6M9 18h4"/></svg>Plan</a>
  </nav>
</div>

<script>
(function(){
"use strict";
/* ---------------- Program ---------------- */
const C2="1-2 RIR, all sets (no failure)";

const DAYS=RAW.map(([id,name,dow,exs],i)=>({id,num:i+1,name,dow,ex:exs.map(a=>{
  const [eid,ss,nm,sets,min,max,inc,effort,note,leg]=a;
  const drop=(ss||leg)?0.10:0.15;
  const rest=leg?150:(ss&&ss[1]==="1")?15:90;
  return {id:eid,ss,name:nm,sets,min,max,inc,effort,note,drop,rest,leg:!!leg,day:id};
})}));
const EX={}; DAYS.forEach(d=>d.ex.forEach(e=>EX[e.id]=e));
// Supersets can be split per pair (machines too far apart): then they run as straight sets with 2 min rest
const pairKey=ex=>ex.day+":"+ex.ss[0];
function isSS(ex){return !!(ex&&ex.ss)&&opt("supersets")!==false}
function partner(ex){if(!ex.ss)return null;const d=DAYS.find(d=>d.id===ex.day);return d.ex.find(e=>e.ss===ex.ss[0]+(ex.ss[1]==="1"?"2":"1"))||null}
function restOf(ex){if(ex.leg)return opt("restLeg");if(isSS(ex)&&ex.ss[1]==="1")return opt("ssGap");return opt("restIso")}
// rep drop to the next set depends on rest (Senna 2011): supersets and long rests ~10%, 90 s ~15%, 60 s ~20%
function dropOf(ex){if(ex.leg||isSS(ex))return 0.10;const t=opt("restIso");return t>=120?0.10:t<=60?0.20:0.15}

/* ---------------- State + storage ---------------- */
const DEF_SETTINGS={bw:190,bf:15,maint:null,rate:null,steps:11000,example:true,inc:{}};
let S={settings:JSON.parse(JSON.stringify(DEF_SETTINGS)),checkins:{weeks:[]},ex:{}};
let MODE="loading", COL=null, LOADED=false, STALE=false;
const LSKEY="shred-coach-v1";
function lsRead(){try{const t=localStorage.getItem(LSKEY);return t?JSON.parse(t):null}catch(e){return null}}
function lsWrite(){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}}
const dirty={},running={};
function bodyOf(id){ if(id==="settings")return S.settings; if(id==="checkins")return S.checkins; return S.ex[id.slice(3)]||{weeks:{}}; }
function save(id){
  if(MODE==="local"){lsWrite();return}
  if(MODE!=="db"||!COL)return;
  dirty[id]=true; if(running[id])return; running[id]=true;
  (async()=>{try{while(dirty[id]){dirty[id]=false;
      try{await COL.doc(id).set(JSON.parse(JSON.stringify(bodyOf(id))))}
      catch(e){ if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));dirty[id]=true;continue}
        toast(e&&e.code==="quota_exceeded"?"Storage is full, so that change wasn't saved.":"Couldn't save that change. Check your connection and try again.");}
    }}finally{running[id]=false}})();
}
function applyDocs(docs){
  const next={settings:JSON.parse(JSON.stringify(DEF_SETTINGS)),checkins:{weeks:[]},ex:{}};
  docs.forEach(d=>{const b=d.data();if(!b)return;
    if(d.id==="settings")next.settings=Object.assign({},DEF_SETTINGS,JSON.parse(JSON.stringify(b)),{inc:Object.assign({},b.inc||{})});
    else if(d.id==="checkins")next.checkins={weeks:Array.isArray(b.weeks)?JSON.parse(JSON.stringify(b.weeks)):[]};
    else if(d.id.startsWith("ex-"))next.ex[d.id.slice(3)]={weeks:JSON.parse(JSON.stringify(b.weeks||{}))};
  });
  S=next;
}
function initStore(){
  MODE="local"; const l=lsRead();
  if(l){try{S=normalizeImport(l)}catch(e){S=Object.assign(S,l)}}
  ensure(); applyFocus();
  LOADED=true; render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}


/* ---------------- Data export / import ---------------- */
function exportText(){return JSON.stringify({app:"shred-coach",v:1,exported:new Date().toISOString(),data:S})}
function normalizeImport(o){
  if(o&&o.data&&typeof o.data==="object")o=o.data;
  if(!o||typeof o!=="object"||typeof o.ex!=="object"||o.ex===null)throw new Error("bad");
  const ex={}; Object.keys(o.ex).forEach(k=>{const w=o.ex[k]&&o.ex[k].weeks; if(w&&typeof w==="object")ex[k]={weeks:w}});
  const st=Object.assign({},DEF_SETTINGS,o.settings||{}); st.inc=Object.assign({},(o.settings&&o.settings.inc)||{});
  return {settings:st,checkins:{weeks:Array.isArray(o.checkins&&o.checkins.weeks)?o.checkins.weeks:[]},ex,
    daily:(o.daily&&typeof o.daily==="object")?o.daily:{},sessions:(o.sessions&&typeof o.sessions==="object")?o.sessions:{},meas:Array.isArray(o.meas)?o.meas:[],cal:(o.cal&&typeof o.cal==="object")?o.cal:null};
}
function showBox(t){const b=document.getElementById("dbox");if(!b)return;b.hidden=false;b.value=t;b.focus();b.select();try{b.setSelectionRange(0,t.length)}catch(e){}}
function copyData(){
  const t=exportText();
  const fail=()=>{showBox(t);toast("Tap the text box below, Select All, then Copy.")};
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>{toast("Copied. Paste it into the offline app's Restore box.");markBackup()},fail);return} }catch(e){}
  fail();
}
function markBackup(){try{localStorage.setItem(LSKEY+"-backup",String(Date.now()))}catch(e){}}
function lastBackup(){try{return +localStorage.getItem(LSKEY+"-backup")||0}catch(e){return 0}}

function saveFile(){
  const t=exportText(); const name="shred-coach-backup-"+new Date().toISOString().slice(0,10)+".json";
  try{const f=new File([t],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Shred Coach backup"}).then(()=>{markBackup();toast("Backup saved.")},e=>{if(!e||e.name!=="AbortError")copyData()});return}}catch(e){}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);markBackup();toast("Backup file downloaded.")}catch(e){copyData()}
}
function restoreText(t){
  let next; try{next=normalizeImport(JSON.parse(String(t).trim()))}catch(e){toast("That doesn't look like a Shred Coach backup.");return}
  const n=Object.keys(next.ex).length;
  if(!confirm("Replace the log on this phone with the backup ("+n+" exercises with data)? This can't be undone."))return;
  S=next; ensure(); applyFocus(); lsWrite(); toast("Restored."); render();
}

function warmText(ex,r0){
  const w=opt("warmup"); if(w==="off"||!r0||r0.logged)return "";
  if(w==="compound"&&ex.effort!==C2)return ""; const i=incOf(ex); if(!i)return "";
  if(r0.tw>0){const a=Math.max(i,fl(r0.tw*0.5,i)),b=fl(r0.tw*0.75,i);
    return `<div class="warm">Warm-up: ${fmtW(a)} lb × 10${b>a&&b<r0.tw?`, ${fmtW(b)} lb × 5`:""}, then work sets</div>`}

const pad2=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const todayKey=()=>keyOf(new Date());
const dayAdd=(k,n)=>{const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return keyOf(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const shortDate=k=>new Date(k+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
const r10=v=>Math.round(v/10)*10;

function ensure(){
  if(!S.daily||typeof S.daily!=="object")S.daily={};
  if(!Array.isArray(S.meas))S.meas=[];
  if(!S.sessions||typeof S.sessions!=="object")S.sessions={};
  if(S.cal===undefined)S.cal=null;
  // carry old weekly check-ins over once
  if(!S.settings.migratedDaily){(S.checkins&&S.checkins.weeks||[]).forEach(e=>{if(e&&e.date&&e.weight>0&&!(S.daily[e.date]&&S.daily[e.date].w))S.daily[e.date]=Object.assign({},S.daily[e.date],{w:e.weight});if(e&&e.date&&e.waist>0)S.meas.push({date:e.date,waist:e.waist})});S.settings.migratedDaily=true}
}
function dayRec(k){if(!S.daily[k])S.daily[k]={};return S.daily[k]}

/* ---------- weight trend ---------- */
function weights(){return Object.keys(S.daily||{}).filter(k=>S.daily[k]&&S.daily[k].w>0).sort().map(k=>({k,w:+S.daily[k].w}))}
function avg7(end){const ws=weights().filter(x=>{const d=daysBetween(x.k,end);return d>=0&&d<=6});return ws.length?ws.reduce((a,b)=>a+b.w,0)/ws.length:null}
function latestAvg(){const ws=weights();return ws.length?avg7(ws[ws.length-1].k):null}
function trendInfo(){const ws=weights();if(!ws.length)return null;const last=ws[ws.length-1].k;const now=avg7(last),prev=avg7(dayAdd(last,-7));
  return {last,now,prev,ch:prev!=null?now-prev:null,pct:prev?(now-prev)/prev:null,n:ws.length}}

/* ---------- adaptive calories (estimated burn from weight trend + intake) ---------- */
function baseKcal(){return nutrition().kcal0}
function curKcal(){return S.cal&&S.cal.kcal>0?S.cal.kcal:baseKcal()}
function kcalOn(k){const h=(S.cal&&S.cal.hist)||[];let v=null;h.forEach(x=>{if(x.from<=k)v=x.kcal});return v||baseKcal()}
function tdeeEst(){
  const ws=weights(); if(!ws.length)return {need:14,days:0};
  const last=ws[ws.length-1].k; const win=ws.filter(x=>daysBetween(x.k,last)<=20);
  const span=daysBetween(win[0].k,last);
  if(span<13||win.length<8)return {need:Math.max(14-(span+1),8-win.length,1)};
  const xs=win.map(x=>daysBetween(win[0].k,x.k)),ys=win.map(x=>x.w),mx=xs.reduce((a,b)=>a+b,0)/xs.length,my=ys.reduce((a,b)=>a+b,0)/ys.length;
  let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)*(x-mx)});const slope=den?num/den:0; // lb per day
  let sum=0;for(let i=0;i<=span;i++){const kk=dayAdd(win[0].k,i),d=S.daily[kk];sum+=(d&&d.kcal>0)?+d.kcal:kcalOn(kk)}
  const intake=sum/(span+1);
  return {tdee:r10(intake-slope*3500),slope,intake:Math.round(intake),weeklyLb:-slope*7,days:span+1};
}
function calReview(){
  const n=nutrition(),e=tdeeEst(),cur=curKcal(),ws=weights();
  const since=(S.cal&&S.cal.reviewed)||(ws.length?ws[0].k:null);
  const dueIn=since?7-daysBetween(since,todayKey()):7;
  if(e.need)return {cur,e,dueIn,msg:`Your estimated burn appears after 2 weeks of morning weigh-ins (about ${e.need} more).`};
  const avgW=latestAvg()||n.bw, targetLb=avgW*n.rate;
  let next=r10(e.tdee-targetLb*3500/7); next=clamp(next,cur-200,cur+200); next=Math.max(next,n.bmr); if(Math.abs(next-cur)<50)next=cur;
  let why=`Losing ${e.weeklyLb.toFixed(1)} lb a week (target ${targetLb.toFixed(1)}). Estimated burn ${e.tdee.toLocaleString()} kcal.`;
  const si=strengthIndex();
  if(si&&si.pct<=-3&&e.weeklyLb>targetLb){next=Math.max(next,cur+150);why+=` Strength is down ${Math.abs(si.pct).toFixed(1)}% while you're losing fast, so eat a bit more to protect muscle.`}
  if(next>=n.bmr&&next===n.bmr&&e.weeklyLb<targetLb*0.75)why+=" Calories are at their floor: add 2,000 daily steps instead of cutting more.";
  return {cur,e,dueIn,next,why};
}

function dayScore(k){const d=S.daily[k];return d&&d.chk?Object.keys(d.chk).filter(x=>d.chk[x]).length:0}
const GOOD_DAY=6;
function streak(){let s=0,k=todayKey();if(dayScore(k)<GOOD_DAY)k=dayAdd(k,-1);while(dayScore(k)>=GOOD_DAY){s++;k=dayAdd(k,-1)}return s}

/* ---------- strength ---------- */
function wkBest(id){const ws=(S.ex[id]&&S.ex[id].weeks)||{},out={};Object.keys(ws).forEach(k=>{(ws[k]||[]).forEach(x=>{if(x&&typeof x.r==="number"){const p=perf(x);if(p!=null&&(out[k]==null||p>out[k]))out[k]=p}})});return out}
function exChange(id){const b=wkBest(id),ks=Object.keys(b).map(Number).sort((a,c)=>a-c);if(ks.length<2)return null;const L=ks[ks.length-1];
  const base=ks.filter(k=>k<=L-2&&k>=L-4);const B=base.length?base[0]:(ks.filter(k=>k<L).pop());if(B==null||!b[B])return null;return {pct:(b[L]/b[B]-1)*100,from:B,to:L,now:b[L]}}
function strengthIndex(){const ch=[];Object.keys(EX).forEach(id=>{const c=exChange(id);if(c&&c.to-c.from>=2)ch.push(c.pct)});if(ch.length<3)return null;return {pct:ch.reduce((a,b)=>a+b,0)/ch.length,n:ch.length}}
function bestExcept(id,k,s){const ws=(S.ex[id]&&S.ex[id].weeks)||{};let b=0;Object.keys(ws).forEach(kk=>(ws[kk]||[]).forEach((x,i)=>{if(x&&typeof x.r==="number"&&!(+kk===+k&&i===+s)){const p=perf(x);if(p>b)b=p}}));return b}
function prList(){const ev=[];Object.keys(EX).forEach(id=>{const sets=[];const ws=(S.ex[id]&&S.ex[id].weeks)||{};Object.keys(ws).forEach(k=>(ws[k]||[]).forEach(x=>{if(x&&typeof x.r==="number"&&x.t)sets.push(x)}));
  sets.sort((a,b)=>a.t-b.t);let best=0;sets.forEach(x=>{const p=perf(x);if(best>0&&p>best*1.0001)ev.push({id,x,p});if(p>best)best=p})});return ev.sort((a,b)=>b.x.t-a.x.t)}

function lineChart(series,o){o=o||{};const all=series.flatMap(s=>s.pts);if(all.length<2)return "";
  const W=320,H=o.h||130,L=36,R=8,T=8,B=o.xlab?18:8;const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]).concat(o.target!=null?[o.target]:[]);
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);if(x1===x0)x1=x0+1;const pd=(y1-y0)*0.15||0.5;y0-=pd;y1+=pd;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B),fmt=o.fmt||(v=>v.toFixed(1));
  let g=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.label||"chart")}">`;
  [y1-pd,(y0+y1)/2,y0+pd].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="grid"/><text x="${L-5}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" class="ax">${fmt(v)}</text>`});
  if(o.target!=null)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(o.target).toFixed(1)}" y2="${Y(o.target).toFixed(1)}" class="tgt"/><text x="${W-R}" y="${(Y(o.target)-4).toFixed(1)}" text-anchor="end" class="ax">${esc(o.targetLabel||"target")}</text>`;
  series.forEach(s=>{if(s.line&&s.pts.length>1)g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${s.pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}"/>`;
    if(s.dots)s.pts.forEach(p=>{g+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${s.r||2.5}" fill="${s.color}"/>`})});
  if(o.xlab)g+=`<text x="${L}" y="${H-4}" class="ax">${esc(o.xlab[0])}</text><text x="${W-R}" y="${H-4}" text-anchor="end" class="ax">${esc(o.xlab[1])}</text>`;
  return g+"</svg>"}
function spark(vals){if(vals.length<2)return "";const W=84,H=26,mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;

function weightChart(){const ws=weights();if(ws.length<2)return "";const last=ws[ws.length-1].k,first=dayAdd(last,-41);const inwin=ws.filter(x=>x.k>=first);if(inwin.length<2)return "";const x0=inwin[0].k;

/* ---------------- Engine (same model as the spreadsheet) ---------------- */
// Weight-dependent 1RM fitted to 303,494 real sets (arXiv 2603.17495); Epley under 3 kg
const LBKG=2.2046;
function E1(w,r){ if(w/LBKG<3)return w*(1+r/30); return w*(1+Math.pow(Math.max(r-1,0),0.85)/(-2.55+4.58*Math.log(w/LBKG))); }
function RA(w,e){ if(!(w>0))return 0; if(w/LBKG<3)return 30*(e/w-1); return 1+Math.pow(Math.max(0,(e/w-1)*(-2.55+4.58*Math.log(w/LBKG))),1/0.85); }
function perf(x){ return x?(x.w>0?E1(x.w,x.r):x.r):null; }
function fl(x,i){ return i>0?Math.round(Math.floor(x/i+1e-9)*i*100)/100:x; }
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
// heaviest weight on your step that the strength estimate says still gives rr reps (after a fatigue drop)
function solveW(P,rr,drop,i){let lo=0,hi=P;for(let k=0;k<50;k++){const m=(lo+hi)/2;if(RA(m,P)*(1-drop)>=rr)lo=m;else hi=m}const w=fl(lo,i);return w>0?w:i}
function incOf(ex){ const v=S.settings.inc&&S.settings.inc[ex.id]; return (v===0||v>0)?v:ex.inc; }
function getSet(id,k,s){ const w=S.ex[id]&&S.ex[id].weeks&&S.ex[id].weeks[k]; const x=w&&w[s]; return (x&&typeof x.r==="number")?x:null; }
function weeksLogged(id,s){ const ws=S.ex[id]&&S.ex[id].weeks; if(!ws)return []; return Object.keys(ws).map(Number).filter(k=>getSet(id,k,s)).sort((a,b)=>a-b); }
function lw(id,s){ const a=weeksLogged(id,s); return a.length?a[a.length-1]:0; }
function kb(id,s,saw){ const a=weeksLogged(id,s).filter(k=>k<saw); return a.length?a[a.length-1]:0; }
function fw(id,s){ const a=weeksLogged(id,s); return a.length?a[0]:0; }
const fmtW=w=>(Math.round(w*100)/100).toString();
function fmtT(w,r,min,max){ if(r==null)return min+"–"+max+" reps"; if(!(w>0))return r+" reps"; return fmtW(w)+" lb × "+r; }

function dayState(day){
  let saw=0; const rows=[];
  day.ex.forEach(ex=>{for(let s=0;s<ex.sets;s++){saw=Math.max(saw,lw(ex.id,s))}});
  // A session stays open for 12 h after its last logged set. After that, the next visit is a new week,
  // and anything skipped last time simply gets its target from the last time it was done.
  let lastT=0; if(saw)day.ex.forEach(ex=>{((S.ex[ex.id]&&S.ex[ex.id].weeks&&S.ex[ex.id].weeks[saw])||[]).forEach(x=>{if(x&&x.t>lastT)lastT=x.t})});
  const ended=!!(saw&&S.sessions&&S.sessions[day.id+":"+saw]&&S.sessions[day.id+":"+saw].end);
  const expired=saw>0&&(ended||(lastT>0&&Date.now()-lastT>12*3600e3));
  day.ex.forEach(ex=>{for(let s=0;s<ex.sets;s++){
    const L=lw(ex.id,s); const status=L===0?((saw===0||expired)?"N":"P"):((L<saw&&!expired)?"P":"D");
    const KB=kb(ex.id,s,saw); const PA=saw?perf(getSet(ex.id,saw,s)):null; const PB=KB?perf(getSet(ex.id,KB,s)):null;
    rows.push({ex,s,L,status,Q:(PA!=null&&PB!=null)?PA/PB:null});
  }});
  const pend=rows.filter(r=>r.status==="P");
  const dw=saw===0?1:(pend.length?saw:saw+1);  // pend is empty once expired
  rows.forEach((row,i)=>Object.assign(row,target(row,i>0&&rows[i-1].ex===row.ex?rows[i-1]:null,saw)));
  rows.forEach(r=>{r.logged=getSet(r.ex.id,dw,r.s); r.last=r.L?getSet(r.ex.id,r.L,r.s):null;});
  // order sets the way you actually do them: supersets alternate A1 s1, A2 s1, A1 s2...
  const gi=r=>{const ss=r.ex.ss;if(isSS(r.ex)&&ss[1]==="2"){const p=day.ex.findIndex(e=>e.ss===ss[0]+"1");if(p>=0)return [p,1]}return [day.ex.indexOf(r.ex),0]};
  const order=rows.slice().sort((a,b)=>{const A=gi(a),B=gi(b);return A[0]-B[0]||a.s-b.s||A[1]-B[1]});
  const next=order.find(r=>r.status==="P"&&!r.logged)||((saw===0||expired)?order.find(r=>!r.logged):null)||null;

function target(row,prev,saw){

  if(L>0){
    const x=getSet(ex.id,L,s); W0=x.w>0?x.w:0; R0=x.r; Pf0=perf(x);
    Pf1=L>1?perf(getSet(ex.id,L-1,s)):null; Pf2=L>2?perf(getSet(ex.id,L-2,s)):null;
    const stall=Pf1!=null&&Pf2!=null&&Pf0<=Pf1*1.005&&Pf1<=Pf2*1.005;
    bwt=(i===0||W0===0); const fast=Pf1!=null&&Pf0>=Pf1*1.05; const ra=w=>RA(w,Pf0);
    KUP=bwt?0:(ra(W0+3*i)>=C+1?3:ra(W0+2*i)>=C+1?2:ra(W0+i)>=C?1:0);
    const KDN=bwt?0:(ra(Math.max(W0-i,0))>=C+1?1:ra(Math.max(W0-2*i,0))>=C+1?2:ra(Math.max(W0-3*i,0))>=C+1?3:4);
    const RJ=bwt?null:Math.floor(ra(W0+i));
    if(stall){BW=bwt?W0:fl(W0*0.9,i);BR=bwt?R0:clamp(Math.floor(ra(BW))-2,C,D);
      BWHY=bwt?"Stalled 3 sessions: slow the lowering to 3 s":"Stalled 3 sessions: reset 10% lighter";}
    else if(R0>=D){BW=bwt?W0:W0+KUP*i;BR=(bwt||KUP===0)?R0+1:clamp(Math.floor(ra(BW)),C,D);
      BWHY=bwt?"Top of range: add reps or hold a weight":KUP===0?("Top of range, but +"+fmtW(i)+" lb would drop you to ~"+RJ+": keep adding reps"):("Hit "+R0+": +"+fmtW(KUP*i)+" lb");}
    else if(R0>=C){BW=W0;BR=fast?Math.min(D,R0+2):R0+1;BWHY=fast?"Moving fast: +2 reps":"Same weight, +1 rep";}
    else if(R0>=C-1||bwt){BW=W0;BR=C;BWHY="1 short last time: same weight, hit "+C;if(bwt&&R0<C-1)BWHY="Short of "+C+": build up to it";}
    else{BW=Math.min(Math.max(W0-i,i),solveW(Pf0,Math.min(D,C+1),0,i));BR=clamp(Math.round(ra(BW)),C,D);BWHY="Only "+R0+" last time: lighter to land in "+C+"–"+D;}
    if(Pf1!=null&&Pf0<Pf1*0.93)BWHY+=" (big drop: check sleep and food)";
  }
  let mode="base",PW=null,PR=null,PP=null,KFX=0;
  if(prev&&status==="P"&&saw){
    const px=getSet(ex.id,saw,s-1);
    if(px){PW=px.w>0?px.w:0;PR=px.r;PP=perf(px);
      if(L===0)mode="copy";
      else if(prev.Q==null)mode="base";
      else mode=prev.Q<0.95?"off":prev.Q>=1.05?"strong":"base";
    }
  }
  const BUMP=L>0&&i>0&&W0>0&&BW===W0;
  let TW,RAWTR;

  else if(status==="N"){TW=null;RAWTR=null}
  else if(mode==="copy"){TW=PW;RAWTR=PR}
  else if(L===0){TW=null;RAWTR=null}
  else if(mode==="off"){TW=W0;RAWTR=R0}
  else if(mode==="strong"){TW=BUMP?BW+i:BW;RAWTR=BUMP?D:Math.min(D,BR+1)}
  else{TW=BW;RAWTR=BR}
  // Live correction: if the set you just did says the planned weight would land you outside the rep range, re-size it now

      if(nw!==tw0){FX0=tw0;TW=nw;RAWTR=clamp(Math.round(RA(nw,PP)*(1-drop)),C,D);mode="fix";}}
  }

  const capped=PRED!=null&&RAWTR!=null&&PRED<RAWTR; const TR=capped?PRED:RAWTR;

  if(status==="D"){why=BWHY}
  else if(status==="N"){why=""}
  else if(mode==="fix"){const up=TW>FX0;
    why=up?("Too light ("+PR+" reps): go up to "+fmtW(TW)+" lb"):(PR<C?("Only "+PR+" reps: drop to "+fmtW(TW)+" lb to stay in "+C+"–"+D):("At "+fmtW(FX0)+" lb you'd fall under "+C+": drop to "+fmtW(TW)+" lb"));tone=up?"good":"bad"}
  else if(capped){why="Expect ~"+PRED+" after fatigue. Beat it if you can"}
  else if(mode==="copy"){why="Match the last set"}
  else if(L===0){why=""}
  else if(mode==="off"){why="Weaker than last week: repeat last week";tone="bad"}
  else if(mode==="strong"){why=BUMP?"Stronger than last week: +"+fmtW(i)+" lb now":"Stronger than last week: +1 rep";tone="good"}
  else{why=BWHY}
  if(!tone&&/fast|\+\d+(\.\d+)? lb/.test(why))tone="good";

  return {tw:TW,tr:TR,why,tone,mode,trend};
}

/* ---------------- Nutrition + check-in math ---------------- */
function nutrition(){
  const st=S.settings; const avgW=(S.daily&&typeof latestAvg==="function")?latestAvg():null; const bw=avgW||+st.bw||0, bf=(+st.bf||0)/100;
  const lbm=bw*(1-bf), lbmKg=lbm/LBKG, bmr=Math.round(370+21.6*lbmKg);
  const maint=st.maint>0?+st.maint:Math.round(bmr*1.6/10)*10;
  const rate=st.rate>0?st.rate/100:(bf>=0.15?0.01:bf>=0.10?0.0075:0.005);
  const lossLb=Math.round(bw*rate*100)/100, deficit=Math.round(lossLb*3500/7/10)*10;
  const kcal0=Math.max(Math.round((maint-deficit)/10)*10,bmr);
  const kcal=(S.cal&&S.cal.kcal>0)?Math.max(S.cal.kcal,bmr):kcal0;
  const protein=Math.round(lbmKg*2.7), fat=Math.round(kcal*0.25/9), carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  return {bw,avgW,lbm,bmr,maint,rate,lossLb,deficit,kcal,kcal0,protein,fat,carbs,steps:+st.steps||0,estMaint:!(st.maint>0)};
}
function checkinRows(){
  const n=nutrition(); const w=S.checkins.weeks; const out=[]; let cal=n.kcal, adj=0;
  w.forEach((e,i)=>{
    const prev=i>0?w[i-1]:null; if(i>0)cal=Math.max(cal+adj,n.bmr);
    let lost=null,pct=null,act="",tone="";adj=0;
    if(prev&&e.weight>0&&prev.weight>0){lost=Math.round((prev.weight-e.weight)*10)/10;pct=lost/prev.weight;}
    if(i===0){act=e.weight>0?"Baseline set. Expect a bigger drop next week from water; that's normal":"Log your average weight";tone="";}
    else if(pct==null){act="Log this week's average weight"}
    else if(i<=1){act="Too early to judge (water). Hold calories"}
    else if(pct<n.rate-0.0025){ if(cal-150<n.bmr){act="Too slow, and calories are at the floor: add 2,000 daily steps instead";tone="warn"} else {adj=-150;act="Too slow: eat 150 kcal less per day next week";tone="warn"} }
    else if(pct>n.rate+0.004){adj=150;act="Losing too fast (risks muscle): eat 150 kcal more per day";tone="bad"}

    out.push({e,i,lost,pct,cal,adj,act,tone});
  });
  const nextCal=out.length?Math.max(out[out.length-1].cal+out[out.length-1].adj,n.bmr):n.kcal;

}

function audio(){try{
  if(navigator.audioSession)navigator.audioSession.type="transient"; // plays with the silent switch on, briefly lowers music
  if(!AC){const C=window.AudioContext||window.webkitAudioContext; if(!C)return null; AC=new C();}
  if(AC.state==="suspended")AC.resume(); return AC;}catch(e){return null}}
function cancelBeep(){beepNodes.forEach(n=>{try{n.stop()}catch(e){}});beepNodes=[]}
function scheduleBeep(secs){cancelBeep(); if(!opt("sound"))return; const ac=audio(); if(!ac)return;
  const t0=ac.currentTime+secs, vol={low:0.2,normal:0.6,high:1}[opt("vol")]||0.6;
  if(opt("warn10")&&secs>12){const o=ac.createOscillator(),g=ac.createGain(),t=t0-10;o.frequency.value=660;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol*0.5,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+0.17);beepNodes.push(o)}
  [0,0.22,0.44].forEach((d,k)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=k===2?1320:880;
    g.gain.setValueAtTime(0.0001,t0+d);g.gain.exponentialRampToValueAtTime(vol,t0+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.18);
    o.connect(g).connect(ac.destination);o.start(t0+d);o.stop(t0+d+0.2);beepNodes.push(o)});}
function startRest(ex,day){
  const st=dayState(day); const nx=st.next; const restEl=document.getElementById("rest");
  let secs=restOf(ex); let head;
  if(!nx){head=st.complete?"Session complete. Nice work.":"All sets logged."; secs=0}
  else if(nx.ex!==ex&&isSS(ex)&&ex.ss[1]==="1"&&nx.ex.ss===ex.ss[0]+"2"){head="Superset: go straight to "+nx.ex.ss;secs=15}
  else head="Next: "+nx.ex.name+", set "+(nx.s+1);
  const tgt=nx?fmtT(nx.tw,nx.tr,nx.ex.min,nx.ex.max)+(nx.mode==="fix"?" · "+(nx.tw<(getSet(nx.ex.id,st.dw,nx.s-1)||{}).w?"lighter":"heavier"):""):"";
  clearInterval(restT); restEnd=Date.now()+secs*1000;
  const tick=()=>{const left=Math.max(0,Math.round((restEnd-Date.now())/1000));
    const snd=!!opt("sound");
    restEl.innerHTML=`<div class="clock">${secs?Math.floor(left/60)+":"+String(left%60).padStart(2,"0"):"✓"}</div><div class="info"><b>${esc(head)}</b>${esc(tgt)}</div>${secs?`<button type="button" id="rests" aria-label="${snd?"Turn alert sound off":"Turn alert sound on"}">${snd?"🔔":"🔕"}</button>`:""}<button type="button" id="restx">${left>0?"Skip":"Close"}</button>`;
    document.getElementById("restx").onclick=()=>{clearInterval(restT);cancelBeep();if(left>0)cancelPush();restEl.hidden=true;restEl.classList.remove("over")};
    const sb=document.getElementById("rests"); if(sb)sb.onclick=()=>{S.settings.sound=!snd;save("settings");if(S.settings.sound)scheduleBeep(Math.max(0,(restEnd-Date.now())/1000));else cancelBeep();tick()};
    if(left<=0&&secs){clearInterval(restT);restEl.querySelector(".clock").textContent="Go";restEl.classList.add("over");try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}};
  restEl.classList.remove("over"); restEl.hidden=false; if(secs){scheduleBeep(secs);schedulePush(secs,"Rest over: go",(nx?head.replace(/^Next: /,"")+" · "+tgt:""))} else {cancelBeep();cancelPush()} tick(); if(secs)restT=setInterval(tick,500);
}

  <div class="stack prose">
   <div class="card"><h3>Week</h3><ul><li>Mon: Day 1 Chest &amp; Back</li><li>Tue: Day 2 Shoulders &amp; Arms</li><li>Wed: Day 3 Legs</li><li>Thu: rest, 25–30 min cycling or incline walk</li><li>Fri: Day 4 Chest &amp; Back</li><li>Sat: Day 5 Shoulders &amp; Arms, then 20–30 min cycling</li><li>Sun: rest, long walk</li></ul></div>
   <div class="card"><h3>How the app coaches you</h3><dl>

    <dt>Log honestly</dt><dd>People usually have about 1 more rep left than they think. Consistent effort keeps targets accurate.<span class="src">${src("Halperin 2022","https://sportrxiv.org/index.php/server/preprint/view/67")}</span></dd>

    const k=el.dataset.set;
    if(el.type==="checkbox")el.addEventListener("change",()=>{S.settings[k]=el.checked;afterSet(k)});
    else el.addEventListener("click",()=>{const v=el.dataset.val;S.settings[k]=v.startsWith("n:")?+v.slice(2):v;afterSet(k)});
  });
  if(typeof bindData==="function")bindData();
  if(typeof bindPush==="function")bindPush();
  bindFocus();
  document.getElementById("sreset").addEventListener("click",()=>{
    if(!confirm("Erase every logged set, check-in and setting on this phone? This can't be undone."))return;
    S={settings:Object.assign({},DEF_SETTINGS,{example:false}),checkins:{weeks:[]},ex:{}}; ensure(); applyFocus(); ["settings","checkins"].forEach(save); Object.keys(EX).forEach(id=>save("ex-"+id));
    try{localStorage.removeItem(LSKEY+"-backup")}catch(e){} applyTheme(); toast("Everything erased."); location.hash="#train";
  });
}
function afterSet(k){save("settings");if(k==="theme")applyTheme();if(k==="keepAwake"){if(opt("keepAwake"))wake();else if(wl){wl.release();wl=null}}
  if(k==="sound"&&!opt("sound"))cancelBeep(); const y=window.scrollY; render(); window.scrollTo(0,y)}
let toastT=null;
function toast(msg){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3200)}
window.addEventListener("hashchange",()=>{closeSheet();UI.editing=null;UI.incEdit=null;window.scrollTo(0,0);UI.scrollNext=/^day/.test(route())&&opt("autoScroll");render()});
// keep the screen awake during a workout when allowed
let wl=null;async function wake(){try{if(opt("keepAwake")&&navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(e){}}
document.addEventListener("click",wake,{once:true});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&wl===null&&route().startsWith("day"))wake()});
window.__engine={E1,RA,dayState,DAYS,setS:x=>{S=x},nutrition,checkinRows};
initStore(); applyTheme();
if("serviceWorker" in navigator){
  // check for a new version every time the app is opened or brought back, and switch to it right away
  const hadSW=!!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadSW&&!reloaded){reloaded=true;location.reload()}});
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    reg.update().catch(()=>{});
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")reg.update().catch(()=>{})});
  }).catch(()=>{}));
}
})();
</script>
